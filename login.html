<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login | SAGORA Technologies</title>
<link rel="icon" href="assets/sagora-logo.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="auth.css">
</head>
<body class="auth-body">
<div class="auth-shell">
  <a href="index.html" class="auth-back">← Back to website</a>
  <div class="auth-card">
    <a href="index.html" class="auth-logo"><img src="assets/sagora-logo.png" alt="SAGORA Technologies"></a>
    <div class="auth-heading"><div class="eyebrow">CLIENT ACCESS</div><h1>Welcome <span>back.</span></h1><p>Sign in to continue to SAGORA.</p></div>

    <div class="social-stack">
      <button class="social-btn" type="button" data-demo-provider="Google"><b class="google-g">G</b> Continue with Google</button>
      <button class="social-btn" type="button" data-demo-provider="Facebook"><b class="facebook-f">f</b> Continue with Facebook</button>
      <button class="social-btn" type="button" data-demo-provider="Apple"><b class="apple-mark">●</b> Continue with Apple</button>
      <button class="social-btn phone-demo" type="button"
        data-demo-provider="Phone OTP">
  <b>✆</b> Continue with Phone OTP
</button>
    </div>

    <div class="auth-divider"><span>OR CONTINUE WITH EMAIL</span></div>

    <form id="loginForm" class="auth-form">
      <label>Email Address<input type="email" id="loginEmail" placeholder="you@example.com" required autocomplete="email"></label>
      <label>Password
        <div class="password-wrap"><input type="password" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password"><button type="button" class="password-toggle" data-toggle="loginPassword">Show</button></div>
      </label>
      <div class="form-between"><span></span><a href="#" id="forgotPassword">Forgot password?</a></div>
      <button class="auth-submit" type="submit">Login to SAGORA <span>↗</span></button>
      <p class="auth-message" id="loginMessage" aria-live="polite"></p>
    </form>

    <div class="auth-switch">New to SAGORA? <a href="signup.html">Create an account</a></div>
    <p class="demo-notice">DEMO MODE · No real social account or OTP authentication is connected.</p>
  </div>
  <p class="auth-footer">© <span class="year"></span> SAGORA Technologies</p>
</div>
<script src="auth.js"></script>
</body>
</html>
