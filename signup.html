<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create Account | SAGORA Technologies</title>
<link rel="icon" href="assets/sagora-logo.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="auth.css">
</head>
<body class="auth-body">
<div class="auth-shell">
  <a href="index.html" class="auth-back">← Back to website</a>
  <div class="auth-card">
    <a href="index.html" class="auth-logo"><img src="assets/sagora-logo.png" alt="SAGORA Technologies"></a>
    <div class="auth-heading"><div class="eyebrow">JOIN SAGORA</div><h1>Create your <span>account.</span></h1><p>Set up a demo account to access our contact details.</p></div>

    <div class="social-stack">
      <button class="social-btn" type="button" data-demo-provider="Google"><b class="google-g">G</b> Sign up with Google</button>
      <button class="social-btn" type="button" data-demo-provider="Facebook"><b class="facebook-f">f</b> Sign up with Facebook</button>
      <button class="social-btn" type="button" data-demo-provider="Apple"><b class="apple-mark">●</b> Sign up with Apple</button>
      <button class="social-btn phone-demo" type="button"
        data-demo-provider="Phone OTP">
  <b>✆</b> Continue with Phone OTP
</button>
    </div>

    <div class="auth-divider"><span>OR SIGN UP WITH EMAIL</span></div>

    <form id="signupForm" class="auth-form">
      <label>Full Name<input type="text" id="signupName" placeholder="Your name" required autocomplete="name"></label>
      <label>Email Address<input type="email" id="signupEmail" placeholder="you@example.com" required autocomplete="email"></label>
      <label>Password
        <div class="password-wrap"><input type="password" id="signupPassword" placeholder="At least 6 characters" minlength="6" required autocomplete="new-password"><button type="button" class="password-toggle" data-toggle="signupPassword">Show</button></div>
      </label>
      <label>Confirm Password<input type="password" id="confirmPassword" placeholder="Enter password again" required autocomplete="new-password"></label>
      <button class="auth-submit" type="submit">Create Demo Account <span>↗</span></button>
      <p class="auth-message" id="signupMessage" aria-live="polite"></p>
    </form>

    <div class="auth-switch">Already have an account? <a href="login.html">Login</a></div>
    <p class="demo-notice">DEMO MODE · Your details are stored only in this browser session.</p>
  </div>
  <p class="auth-footer">© <span class="year"></span> SAGORA Technologies</p>
</div>
<script src="auth.js"></script>
</body>
</html>
